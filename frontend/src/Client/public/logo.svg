<svg xmlns="http://www.w3.org/2000/svg" width="370" height="120" viewBox="0 0 370 120">
    <defs>
        <!-- Dégradés crème et chocolat -->
        <linearGradient id="creamGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fae8d2"/>
            <stop offset="100%" stop-color="#f6d9b8"/>
        </linearGradient>
        <linearGradient id="chocoGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b77b52"/>
            <stop offset="100%" stop-color="#7a4a2a"/>
        </linearGradient>
        <radialGradient id="coffeeSurface" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#8b5a33"/>
            <stop offset="100%" stop-color="#5a341c"/>
        </radialGradient>

        <style>
        @font-face {
            font-family: "Pacifico";
            src:
                url("https://fonts.gstatic.com/s/pacifico/v22/FwZY7-Qmy14u9lezJ-6H6Mk.woff2")
                    format("woff2");
        }
        </style>

    </defs>

    <!-- Tasse plus détaillée -->
    <g transform="translate(25, 40)">
        <!-- Base de tasse -->
        <ellipse cx="25" cy="40" rx="28" ry="8" fill="#e6cbb0"/>
        <!-- Corps -->
        <path d="M0,10 Q0,35 25,45 Q50,35 50,10 Z"
              fill="url(#creamGradient)" stroke="#7a4a2a" stroke-width="3" />
        <!-- Intérieur café -->
        <ellipse cx="25" cy="10" rx="25" ry="8" fill="url(#coffeeSurface)" stroke="#7a4a2a" stroke-width="2"/>
        <!-- Mousse / latte -->
        <path d="M12 7 Q17 4 22 7 Q27 10 32 7 Q37 4 40 7"
              fill="none"
              stroke="#f8e6cf"
              stroke-width="1.5"
              stroke-linecap="round"/>

        <!-- Seconde mousse plus basse -->
        <path d="M10 11 Q15 8 20 11 Q25 14 30 11 Q35 8 38 11"
              fill="none"
              stroke="#f8e6cf"
              stroke-width="1.3"
              stroke-linecap="round"
              opacity="0.9"/>

        <!-- Anse -->
        <path d="M50 18 Q63 25 50 35"
              fill="none" stroke="#7a4a2a" stroke-width="4" stroke-linecap="round"/>

    </g>

    <!-- Texte CookieCream avec inversion de couleurs -->
    <!-- Bordure externe ultra fine pour lisibilité -->
    <text x="85" y="80"
          font-family="'Pacifico', cursive"
          font-weight="400"
          font-size="48"
          fill="#5a341c"
          stroke="url(#creamGradient)"
          stroke-width="6"
          paint-order="stroke">
        CookieCream
    </text>
    <!-- Liseré fin extérieur -->
    <text x="85" y="80"
          font-family="'Pacifico', cursive"
          font-size="48"
          fill="url(#chocoGradient)"
          stroke="#5a341c"
          stroke-width="2"
          paint-order="stroke">
        CookieCream
    </text>
</svg>
